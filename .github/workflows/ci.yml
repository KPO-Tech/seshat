name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build ./cmd/cli/...

      - name: Build gRPC server
        run: go build ./cmd/grpc/...

      - name: Build all packages
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    # The pgvector store tests need a real database (they skip without one).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: seshat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESHAT_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/seshat?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: go test -race ./... -timeout 300s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        # Report-only for now: this is the first SAST pass on an existing
        # ~176k line codebase and surfaced 446 pre-existing findings (57
        # HIGH, 228 MEDIUM, 161 LOW) that need triage before this can gate
        # merges. Tracked separately; flip continue-on-error off once the
        # backlog is triaged (fixed or explicitly accepted with #nosec).
        continue-on-error: true
        uses: securego/gosec@master
        with:
          args: -exclude-generated ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce PR branch flow
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.base_ref }}" == "main" && \
                "${{ github.head_ref }}" != "dev" ]]; then
            echo "Pull requests targeting main must come from dev."
            echo "Current head branch: ${{ github.head_ref }}"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.base_ref }}" == "dev" ]]; then
            case "${{ github.head_ref }}" in
              feat/*|feature/*|fix/*|bugfix/*|docs/*|refactor/*|test/*|chore/*|perf/*|ci/*|dependabot/*)
                ;;
              *)
                echo "Pull requests targeting dev must come from a typed topic branch."
                echo "Allowed prefixes: feat/, feature/, fix/, bugfix/, docs/, refactor/, test/, chore/, perf/, ci/, dependabot/"
                echo "Current head branch: ${{ github.head_ref }}"
                exit 1
                ;;
            esac
          fi

          echo "Branch policy check passed."

  # gate is the single required status check for branch protection.
  # Adding new jobs above automatically blocks the merge without
  # touching the branch protection rules again.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [build, test, lint, security, branch-policy]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" || \
                "${{ needs.test.result }}"  != "success" || \
                "${{ needs.lint.result }}"  != "success" || \
                "${{ needs.security.result }}" != "success" || \
                "${{ needs.branch-policy.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            echo "  build: ${{ needs.build.result }}"
            echo "  test:  ${{ needs.test.result }}"
            echo "  lint:  ${{ needs.lint.result }}"
            echo "  security: ${{ needs.security.result }}"
            echo "  branch-policy: ${{ needs.branch-policy.result }}"
            exit 1
          fi
          echo "All checks passed."
